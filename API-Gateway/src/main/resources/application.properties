
# =========================================================
# API GATEWAY CONFIGURATION
# =========================================================

spring.application.name=S59-API-GATEWAY
server.port=8000


# =========================================================
# EUREKA CLIENT CONFIGURATION
# =========================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true


# =========================================================
# ROUTE 1: MS1
# =========================================================

spring.cloud.gateway.server.webflux.routes[0].id=MS1
spring.cloud.gateway.server.webflux.routes[0].uri=lb://MS1
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/ms1/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.name=ms1CB
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.fallbackUri=forward:/fallback/ms1


# =========================================================
# ROUTE 2: MS2
# =========================================================

spring.cloud.gateway.server.webflux.routes[1].id=MS2
spring.cloud.gateway.server.webflux.routes[1].uri=lb://MS2
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/ms2/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.name=ms2CB
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.fallbackUri=forward:/fallback/ms2


# =========================================================
# RESILIENCE4J CONFIGURATION
# =========================================================

resilience4j.timelimiter.configs.default.timeout-duration=5s
resilience4j.circuitbreaker.configs.default.sliding-window-size=10


# =========================================================
# ROUTE 3: PRODUCT SERVICE
# =========================================================

spring.cloud.gateway.server.webflux.routes[2].id=PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].uri=lb://SOA-SKILL-PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/products/**


